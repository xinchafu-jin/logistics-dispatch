spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/logistics?serverTimezone=Asia/Taipei&useSSL=false&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
# schema 由 seed/schema.sql 管理，Hibernate 不再建立或修改資料表。
# 修改 entity 欄位時務必同步更新 seed/schema.sql，否則執行時才會發現對不上。
spring.jpa.hibernate.ddl-auto=none
app.osrm.base-url=http://localhost:5001
# JWT 僅用於開發環境的預設值；部署時請用環境變數覆寫。
app.jwt.secret=${JWT_SECRET:dev-only-change-this-jwt-secret-before-deploying-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
# GPS每5分鐘上傳一次；超過10分鐘視為非即時位置。原始軌跡預設保存90天。
app.gps.freshness-minutes=${GPS_FRESHNESS_MINUTES:10}
app.gps.retention-days=${GPS_RETENTION_DAYS:90}
# 司機大頭照儲存位置；正式環境可改成持久化磁碟路徑。
app.storage.driver-photos-dir=${DRIVER_PHOTOS_DIR:uploads/driver-photos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
#中油汽油、柴油等最新牌價，約每 7 日更新一次
app.cpc.base-url=https://vipmbr.cpc.com.tw/opendata
#ai模型key
spring.ai.openai.api-key=${AI_API_KEY:}
spring.ai.openai.chat.model=${AI_MODEL:deepseek-v4-flash}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.deepseek.com}
