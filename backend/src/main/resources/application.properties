spring.application.name=backend
# 本機開發可在 backend/.env 放必要設定；正式環境仍以作業系統環境變數覆寫。
# 同時支援從 backend 目錄或專案根目錄啟動。
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=${SHOW_SQL:true}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.osrm.base-url=${OSRM_BASE_URL:http://localhost:5001}
# 訂單只能由此直線半徑內的倉庫排程；預設 30 公里，可由環境變數調整。
app.dispatch.max-store-warehouse-distance-meters=${DISPATCH_MAX_STORE_WAREHOUSE_DISTANCE_METERS:30000}
# JWT 僅用於開發環境的預設值；部署時請用環境變數覆寫。
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:}}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
# GPS每5分鐘上傳一次；超過10分鐘視為非即時位置。原始軌跡預設保存5年。
app.gps.freshness-minutes=${GPS_FRESHNESS_MINUTES:10}
app.gps.retention-years=${GPS_RETENTION_YEARS:5}
# 司機結束里程與下班打卡時，必須位於路線所屬公司／倉庫此距離內（公尺）。
app.attendance.clock-out-radius-meters=${CLOCK_OUT_RADIUS_METERS:200}
# 司機大頭照與交貨照片儲存位置；正式環境可改成持久化磁碟路徑。
app.storage.driver-photos-dir=${DRIVER_PHOTOS_DIR:uploads/driver-photos}
app.storage.delivery-photos-dir=${DELIVERY_PHOTOS_DIR:uploads/delivery-photos}
app.storage.mileage-photos-dir=${MILEAGE_PHOTOS_DIR:uploads/mileage-photos}
app.storage.leave-evidence-dir=${LEAVE_EVIDENCE_DIR:uploads/leave-evidence}
spring.servlet.multipart.max-file-size=5MB
# 整個請求比檔案本身大一點（multipart 的邊界與表頭），設成跟檔案一樣大，剛好 5MB 的照片會被擋
spring.servlet.multipart.max-request-size=6MB
#中油汽油、柴油等最新牌價，約每 7 日更新一次
app.cpc.base-url=https://vipmbr.cpc.com.tw/opendata
# 啟動時會先同步一次；之後每日 00:15 再同步，可用環境變數調整。
app.cpc.sync-cron=${CPC_SYNC_CRON:0 15 0 * * *}
# 地址轉座標使用 Nominatim；正式部署請改成專案可識別的聯絡資訊。
app.geocode.base-url=${GEOCODE_BASE_URL:https://nominatim.openstreetmap.org}
app.geocode.user-agent=${GEOCODE_USER_AGENT:logistics-dispatch/1.0}
#ai模型key
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${AI_MODEL:deepseek-v4-flash}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.deepseek.com}
#key 加密；預設值僅供開發，真正的值用環境變數覆寫
app.crypto.password=${APP_CRYPTO_PASSWORD:}
app.crypto.salt=${APP_CRYPTO_SALT:}

management.endpoints.web.exposure.include=health

# 允許的前端來源。即使同源，瀏覽器對 POST 仍會送 Origin，Spring 的 CORS 過濾器
# 比對不到就回 403，所以正式環境務必用 CORS_ALLOWED_ORIGINS 覆寫成實際網域。
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4001,http://127.0.0.1:4001,http://localhost:4204,http://127.0.0.1:4204}
