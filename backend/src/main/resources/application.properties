spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/logistics?serverTimezone=Asia/Taipei&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# JWT 僅用於開發環境的預設值；部署時請用環境變數覆寫。
app.jwt.secret=${JWT_SECRET:dev-only-change-this-jwt-secret-before-deploying-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# 第一位物流主管：僅在資料庫還沒有管理員時建立。
app.bootstrap-admin.account=${BOOTSTRAP_ADMIN_ACCOUNT:manager}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Manager123!}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:物流主管}
