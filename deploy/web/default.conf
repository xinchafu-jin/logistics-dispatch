# Nginx 站台設定，COPY 進映像的 /etc/nginx/conf.d/default.conf。
#
# 兩個子網域各自都設 /api/ 反向代理，所以兩邊都是同源，
# 前端的相對路徑與 interceptor 的 startsWith('/api/') 判斷都不用改。
#
# 目前只有 80。443 由 certbot 在 VM 上自動補寫進來——
# 憑證還不存在時就寫 ssl_certificate 會讓 Nginx 啟動失敗。
#
# 本機測試（沒有 DNS 指向正式網域，用 Host 標頭即可）：
#   curl -I -H "Host: dispatch.xinchafujin.com" http://localhost
#   curl -I -H "Host: driver.xinchafujin.com"  http://localhost

# ---------- 後台 ----------
server {
    listen 80;
    server_name dispatch.xinchafujin.com xinchafujin.com;

    root /var/www/admin;
    index index.html;

    # certbot 的 HTTP-01 驗證，必須排在其他規則之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # backend 是 compose 的服務名稱，Docker 內建 DNS 會解析。
    # 不能寫 127.0.0.1——容器裡的 127.0.0.1 是 Nginx 自己。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CI/CD 與 Docker healthcheck 用來確認後端真的起來了
    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    # Angular 建置產物檔名帶 hash，可以長期快取
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Angular router：/orders/123 這種路徑在磁碟上不存在，
    # 找不到實體檔案就回 index.html 交給前端路由。漏了這行按 F5 會 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 司機端 PWA ----------
server {
    listen 80;
    server_name driver.xinchafujin.com;

    root /var/www/driver;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # service worker 絕對不能被快取，否則司機端會卡在舊版，
    # 出現「明明發布了新版但畫面沒變」這種最難查的問題。
    location ~* ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
