# Nginx 站台設定，COPY 進映像的 /etc/nginx/conf.d/default.conf。
#
# 憑證由 certbot 以 webroot 模式簽發，一張 SAN 憑證涵蓋三個網域，
# 透過 compose 的 ./certbot/conf 掛載到容器的 /etc/letsencrypt（唯讀）。
#
# 三個 server：
#   :80   三個網域都收，只做 ACME 驗證與導轉
#   :443  dispatch + 裸網域 → 後台
#   :443  driver            → 司機端 PWA
# 兩個 443 靠 SNI 分流，共用同一組憑證檔案。
#
# 兩個子網域各自都有 /api/ 反向代理，所以兩邊都是同源，
# 前端的相對路徑與 interceptor 的 startsWith('/api/') 判斷都不用改。

# ---------- 壓縮 ----------
# 這個檔案被 nginx.conf 放在 http 區塊裡 include，寫在 server 外面就是三個站都套用。
# 看板每 15 秒抓一次全部訂單（/api/orders 沒分頁，90 天約 4MB 的 JSON），不壓縮就每次整包傳；
# JSON 壓縮後約剩一成。gzip_proxied any：/api/ 經 proxy_pass 回來的回應預設不壓，要明寫。
# text/html 永遠會壓，不用列在 gzip_types（列了 Nginx 會警告重複）。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/javascript text/css text/plain image/svg+xml application/manifest+json;

# ---------- HTTP：只負責驗證與導轉 ----------
server {
    listen 80;
    server_name xinchafujin.com dispatch.xinchafujin.com driver.xinchafujin.com;

    # 續期時 certbot 仍走 HTTP 驗證，必須排在導轉規則之前，
    # 否則驗證請求會被 301 導走而失敗。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 後台 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name dispatch.xinchafujin.com xinchafujin.com;

    # 憑證目錄名取自 certbot 的第一個 -d 參數
    ssl_certificate     /etc/letsencrypt/live/xinchafujin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xinchafujin.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/admin;
    index index.html;

    # Nginx 預設只收 1MB 的請求本體，手機照片常常 2~5MB，超過會在這層直接回 413，
    # 請求根本到不了後端。後端擋 5MB 的檔案，再留一點給 multipart 的表頭。
    client_max_body_size 6m;

    # backend 是 compose 的服務名稱，Docker 內建 DNS 會解析。
    # 不能寫 127.0.0.1——容器裡的 127.0.0.1 是 Nginx 自己。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket（STOMP）。Nginx 預設用 HTTP/1.0 轉發且不帶 Upgrade 標頭，
    # 走上面的 /api/ 會讓握手變成普通請求，後端回 400，聊天室與看板即時推播全部失效。
    # 前綴比 /api/ 長，Nginx 會優先選這段。
    # 不用另外調 proxy_read_timeout：STOMP 心跳 10 秒一次，遠小於預設的 60 秒閒置上限。
    location /api/ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 大頭照與送達照片存在後端容器的磁碟上，由後端回傳。
    # 一定要 ^~：下面的 \.(png|jpg...)$ 是正規表示式 location，比對時優先於一般前綴，
    # 少了 ^~ 照片請求會被它接走，到 /var/www/admin 找檔案然後 404。
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CI/CD 與 Docker healthcheck 用來確認後端真的起來了
    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    # 地圖的 MapLibre worker（maplibre-gl-worker.mjs）。Nginx 內建的 mime.types 沒有 .mjs，
    # 會送成 application/octet-stream，瀏覽器拒絕載入模組，地圖只剩底色、畫不出圖磚。
    # 檔名沒帶 hash（angular.json 直接從 node_modules 複製），所以不能長期快取。
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        add_header Cache-Control "no-cache";
    }

    # Angular 建置產物檔名帶 hash，可以長期快取
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Angular router：/orders/123 這種路徑在磁碟上不存在，
    # 找不到實體檔案就回 index.html 交給前端路由。漏了這行按 F5 會 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 司機端 PWA ----------
server {
    listen 443 ssl;
    http2 on;
    server_name driver.xinchafujin.com;

    ssl_certificate     /etc/letsencrypt/live/xinchafujin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xinchafujin.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/driver;
    index index.html;

    # 司機上傳大頭照與送達照片走這個網域，理由同後台。
    # 出車前安全檢查一次送兩張照片（各最多 5MB），所以這個網域放到 11m，跟後端 max-request-size 一致
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 司機端聊天室的 WebSocket，理由同後台
    location /api/ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 理由同後台：^~ 才不會被下面的圖片副檔名規則搶走
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # service worker 絕對不能被快取，否則司機端會卡在舊版，
    # 出現「明明發布了新版但畫面沒變」這種最難查的問題。
    location ~* ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
location ~* \.mjs$ {
    types { text/javascript mjs; }
    add_header Cache-Control "no-cache";
}
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
