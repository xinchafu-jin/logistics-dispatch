<main class="login-page" [class.is-dark-theme]="isDarkTheme()">
  <header class="topbar">
    <div class="brand">
      <app-brand-logo></app-brand-logo>
      <strong>司機工作台</strong>
    </div>
    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [title]="isDarkTheme() ? '切換為淺色模式' : '切換為深色模式'"
      [attr.aria-label]="isDarkTheme() ? '切換為淺色模式' : '切換為深色模式'"
    >
      @if (isDarkTheme()) {
        <svg lucideSun aria-hidden="true"></svg>
      } @else {
        <svg lucideMoon aria-hidden="true"></svg>
      }
    </button>
  </header>

  <section class="login-shell" aria-labelledby="login-title">
    <div class="login-copy">
      <p class="eyebrow">司機登入</p>
      <h1 id="login-title">開始今天的工作</h1>
      <p>登入後可查看今日出勤狀態與已發布班表。</p>
    </div>

    <form (submit)="submit($event)" novalidate>
      <label for="account">帳號</label>
      <input
        #accountInput
        id="account"
        type="text"
        autocomplete="username"
        placeholder="輸入司機帳號"
        [value]="account()"
        [disabled]="isSubmitting()"
        (input)="account.set(accountInput.value)"
      />

      <label for="password">密碼</label>
      <input
        #passwordInput
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="輸入密碼"
        [value]="password()"
        [disabled]="isSubmitting()"
        (input)="password.set(passwordInput.value)"
      />

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? (isLocating() ? '正在定位...' : '登入驗證中...') : '登入工作台' }}
      </button>

      @if (errorMessage()) {
        <p class="error-message" role="alert">{{ errorMessage() }}</p>
      }
    </form>

    <div class="account-help">
      <p class="help-text">帳號無法登入時，請聯絡物流後台管理員確認帳號狀態。</p>
      <button type="button" class="account-application-button" (click)="openAccountApplication()">
        <svg lucideUserRoundPlus aria-hidden="true"></svg>
        申請司機帳號
      </button>
    </div>

    @if (isAccountApplicationOpen()) {
      <section class="account-application" aria-labelledby="account-application-title">
        <header>
          <div>
            <p class="eyebrow">帳號申請</p>
            <h2 id="account-application-title">申請司機帳號</h2>
          </div>
          <button
            type="button"
            class="application-close"
            title="關閉申請說明"
            aria-label="關閉申請說明"
            (click)="closeAccountApplication()"
          >
            <svg lucideX aria-hidden="true"></svg>
          </button>
        </header>
        <p>帳號申請須由主管簽核後才會建立登入權限。</p>
        <dl>
          <div>
            <dt>申請資料</dt>
            <dd>姓名、手機號碼與登入帳號</dd>
          </div>
          <div>
            <dt>初始密碼</dt>
            <dd>身分證字號</dd>
          </div>
        </dl>
        <p class="application-notice">
          申請與簽核 API 尚未提供；目前不會送出或保存任何個人資料。
        </p>
      </section>
    }
  </section>
</main>
