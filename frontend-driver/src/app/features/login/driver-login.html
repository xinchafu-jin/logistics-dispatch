<main class="login-page">
  <header class="topbar">
    <div class="brand">
      <app-brand-logo></app-brand-logo>
      <strong>司機工作台</strong>
    </div>
  </header>

  <section class="login-shell" aria-labelledby="login-title">
    <div class="login-copy">
      <p class="eyebrow">司機登入</p>
      <h1 id="login-title">開始今天的工作</h1>
      <p>登入後可查看今日出勤狀態與已發布班表。</p>
    </div>

    <form (submit)="submit($event)" novalidate>
      <label for="account">帳號</label>
      <input
        #accountInput
        id="account"
        type="text"
        autocomplete="username"
        placeholder="輸入司機帳號"
        [value]="account()"
        [disabled]="isSubmitting()"
        (input)="account.set(accountInput.value)"
      />

      <label for="password">密碼</label>
      <input
        #passwordInput
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="輸入密碼"
        [value]="password()"
        [disabled]="isSubmitting()"
        (input)="password.set(passwordInput.value)"
      />

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? (isLocating() ? '正在定位...' : '登入驗證中...') : '登入工作台' }}
      </button>

      @if (errorMessage()) {
        <p class="error-message" role="alert">{{ errorMessage() }}</p>
      }
    </form>

    <button type="button" class="application-toggle" (click)="toggleApplication()">
      {{ applicationOpen() ? '收起帳號申請' : '沒有帳號？申請司機帳號' }}
    </button>

    @if (applicationOpen()) {
      <form class="application-form" [formGroup]="applicationForm" (ngSubmit)="submitApplication()">
        <label>申請帳號<input type="text" formControlName="account" autocomplete="username" /></label>
        <label>姓名<input type="text" formControlName="name" autocomplete="name" /></label>
        <label>電話<input type="tel" formControlName="phone" autocomplete="tel" /></label>
        <label>身分證／識別碼<input type="text" formControlName="nationalId" autocomplete="off" /></label>
        <button type="submit" [disabled]="applicationSubmitting()">
          {{ applicationSubmitting() ? '送出中...' : '送出申請' }}
        </button>
      </form>
    }
    @if (applicationMessage()) { <p class="application-message is-success">{{ applicationMessage() }}</p> }
    @if (applicationError()) { <p class="application-message error-message">{{ applicationError() }}</p> }

    <p class="help-text">帳號申請會由物流後台主管審核與啟用。</p>
  </section>
</main>
