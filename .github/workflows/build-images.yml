# 建置後端與前端映像並推上 GitHub Container Registry。
#
# 為什麼在 CI 建而不是在 VM 建：
#   1. VM 是 e2-medium（4GB），Angular 的 AOT 編譯器光一個 worker 就要 2GB 以上，會 OOM
#   2. 開發機是 arm64、VM 是 amd64，本機建的映像 VM 跑不動；runner 原生就是 amd64
#
# 映像是 private 的，VM 需要先 docker login ghcr.io（唯讀 PAT）才能拉取。

name: Build images

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'frontend-driver/**'
      - 'deploy/web/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/ci.yml'
      - '.github/ci/**'         # CI 的基礎資料改了，測試結果就可能變，要重新驗證
  workflow_dispatch:        # 允許手動觸發，第一次測試用得到

env:
  REGISTRY: ghcr.io

jobs:
  # 先跑 ci.yml 的測試與前端 build，沒過就停在這裡，不建映像也不部署
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # 推映像到 ghcr 必需

    strategy:
      fail-fast: false      # 一個失敗時另一個仍然跑完，方便一次看到兩邊的問題
      matrix:
        include:
          - name: logistics-backend
            dockerfile: backend/Dockerfile
          - name: logistics-web
            dockerfile: deploy/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 自動提供，不用自己建

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .                              # build context 是專案根目錄，.dockerignore 才會生效
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64                  # 對齊 GCE VM 的架構
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 映像推上 ghcr 後，SSH 進 VM 拉新版並重啟。
  # VM 上已經用唯讀 PAT 登入過 ghcr（認證存在 ~/.docker/config.json），
  # 所以這裡不需要再登入。那組 PAT 到期時要重新 docker login，否則 pull 會失敗。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Pull and restart on VM
        run: |
          ssh -o StrictHostKeyChecking=accept-new jin@${{ secrets.VM_HOST }} '
            set -e
            cd ~/deploy
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d
            docker image prune -f
          '

      # 後端啟動要 20-40 秒，沒有這段會在它還沒好的時候就判定佈署成功
      - name: Wait for health
        run: |
          curl --retry 12 --retry-delay 5 --retry-all-errors \
               -fsS https://dispatch.xinchafujin.com/actuator/health
          echo
