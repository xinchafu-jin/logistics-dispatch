# 建置後端與前端映像並推上 GitHub Container Registry。
#
# 為什麼在 CI 建而不是在 VM 建：
#   1. VM 是 e2-medium（4GB），Angular 的 AOT 編譯器光一個 worker 就要 2GB 以上，會 OOM
#   2. 開發機是 arm64、VM 是 amd64，本機建的映像 VM 跑不動；runner 原生就是 amd64
#
# 映像是 private 的，VM 需要先 docker login ghcr.io（唯讀 PAT）才能拉取。

name: Build images

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'frontend-driver/**'
      - 'deploy/web/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:        # 允許手動觸發，第一次測試用得到

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # 推映像到 ghcr 必需

    strategy:
      fail-fast: false      # 一個失敗時另一個仍然跑完，方便一次看到兩邊的問題
      matrix:
        include:
          - name: logistics-backend
            dockerfile: backend/Dockerfile
          - name: logistics-web
            dockerfile: deploy/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 自動提供，不用自己建

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .                              # build context 是專案根目錄，.dockerignore 才會生效
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64                  # 對齊 GCE VM 的架構
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
