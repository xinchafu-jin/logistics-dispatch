<div class="dispatch-layout" [class.is-light-theme]="isLightTheme()">
  <header class="workspace-header">
    <div class="workspace-identity">
      <a
        class="workspace-brand"
        routerLink="/dispatch/dashboard"
        aria-label="捷流智慧物流，前往今日調度"
      >
        <app-brand-logo />
      </a>

      <span class="workspace-divider" aria-hidden="true"></span>

      <div>
        <p class="workspace-eyebrow">JFLOW DISPATCH</p>
        <h1>{{ pageTitle() }}</h1>
      </div>
    </div>

    <div class="workspace-actions">
      <span class="workspace-status">{{ user()?.displayName ?? '物流後台' }}</span>
      <span
        class="application-notification"
        aria-label="司機帳號申請待後端 API 提供"
        title="司機帳號申請待後端 API 提供"
      >
        <svg lucideBell aria-hidden="true"></svg>
      </span>
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [title]="isLightTheme() ? '切換為深色模式' : '切換為淺色模式'"
        [attr.aria-label]="isLightTheme() ? '切換為深色模式' : '切換為淺色模式'"
      >
        @if (isLightTheme()) {
          <svg lucideMoon aria-hidden="true"></svg>
        } @else {
          <svg lucideSun aria-hidden="true"></svg>
        }
      </button>
      <button
        type="button"
        class="logout-button"
        [disabled]="isSigningOut()"
        (click)="signOut()"
        title="登出系統"
        aria-label="登出系統"
      >
        <svg lucideLogOut aria-hidden="true"></svg>
      </button>
    </div>
  </header>

  <aside class="dispatch-sidebar">
    <nav class="sidebar-nav" aria-label="物流後台主選單">
      <p class="nav-group-title">調度作業</p>

      <a
        class="nav-item"
        routerLink="/dispatch/dashboard"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg lucideWorkflow aria-hidden="true"></svg>
        <span>今日調度</span>
      </a>

      <p class="nav-group-title">管理與監控</p>

      <a class="nav-item" routerLink="/dispatch/orders" routerLinkActive="is-active">
        <svg lucideClipboardCheck aria-hidden="true"></svg>
        <span>訂單審核</span>
      </a>

      <a class="nav-item" routerLink="/dispatch/resources" routerLinkActive="is-active">
        <svg lucideTruck aria-hidden="true"></svg>
        <span>人車資源</span>
      </a>

      <a
        class="nav-item"
        routerLink="/dispatch/schedules"
        routerLinkActive="is-active"
        title="司機班表"
        aria-label="司機班表"
      >
        <svg lucideCalendarDays aria-hidden="true"></svg>
        <span>司機班表</span>
      </a>

      <a class="nav-item" routerLink="/dispatch/fleet" routerLinkActive="is-active">
        <svg lucideMapPinned aria-hidden="true"></svg>
        <span>即時車隊</span>
      </a>

      <a class="nav-item" routerLink="/dispatch/anomalies" routerLinkActive="is-active">
        <svg lucideTriangleAlert aria-hidden="true"></svg>
        <span>異常中心</span>
      </a>

      <a class="nav-item" routerLink="/dispatch/reports" routerLinkActive="is-active">
        <svg lucideChartNoAxesCombined aria-hidden="true"></svg>
        <span>營運報表</span>
      </a>
    </nav>
  </aside>

  <main class="dispatch-workspace">
    <section class="workspace-content">
      <router-outlet />
    </section>
  </main>
</div>
