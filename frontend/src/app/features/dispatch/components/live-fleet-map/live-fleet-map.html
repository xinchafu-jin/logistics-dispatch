<section
  class="live-fleet-map"
  [class.is-resizable]="resizable()"
  [class.is-resizing]="isResizingMap()"
  [style.height.px]="resizable() ? mapHeight() : null"
  aria-labelledby="fleet-map-title"
>
  <div class="fleet-map-stage">
    <header class="fleet-map-header">
      <div class="fleet-map-select-wrapper">
        <select
          id="fleet-map-title"
          class="fleet-map-city-select"
          [value]="selectedCityId()"
          (change)="onCityChange($event)"
          aria-label="選擇配送區域地圖"
        >
          @for (city of cities; track city.id) {
            <option [value]="city.id">{{ city.label }}</option>
          }
        </select>
        <mat-icon class="fleet-map-select-arrow" aria-hidden="true">arrow_drop_down</mat-icon>
      </div>
    </header>

    <div #mapCanvas class="fleet-map-canvas" aria-label="配送區域地圖"></div>

  </div>

  @if (resizable()) {
    <div
      class="fleet-map-resize-handle"
      role="separator"
      aria-orientation="horizontal"
      aria-label="調整地圖高度"
      title="拖曳調整地圖高度；也可用上下方向鍵"
      tabindex="0"
      aria-valuemin="300"
      [attr.aria-valuemax]="maxMapHeight()"
      [attr.aria-valuenow]="mapHeight()"
      [attr.aria-valuetext]="'地圖高度 ' + mapHeight() + ' 像素'"
      (pointerdown)="startMapResize($event)"
      (pointermove)="resizeMap($event)"
      (pointerup)="finishMapResize($event)"
      (pointercancel)="finishMapResize($event)"
      (keydown)="adjustMapHeight($event)"
    >
      <mat-icon aria-hidden="true">drag_handle</mat-icon>
    </div>
  }

</section>
